# A regular release resource, not a pre-install hook: the bundled DB must exist first.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dnsmonitor.name" . }}-migrate-{{ .Release.Revision }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ add .Values.migration.timeoutSeconds 120 }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      tolerations: {{ .Values.tolerations | toJson }}
      containers:
        - name: migrate
          image: {{ include "dnsmonitor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/apps/cli/src/bootstrap.js", "migrate"]
          env:
            {{- include "dnsmonitor.dbEnv" . | nindent 12 }}
          securityContext:
            {{- include "dnsmonitor.security" . | nindent 12 }}
          resources: {{ .Values.migration.resources | toJson }}
          volumeMounts:
            - { name: app-secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        {{- include "dnsmonitor.secretVolume" . | nindent 8 }}
