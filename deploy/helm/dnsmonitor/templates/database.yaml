{{- if .Values.database.bundled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnsmonitor.name" . }}-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dnsmonitor.name" . }}-db
spec:
  serviceName: {{ include "dnsmonitor.name" . }}-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mariadb
          image: {{ .Values.database.image | quote }}
          args: ["--innodb-buffer-pool-size=64M", "--max-connections={{ .Values.database.maxConnections }}", "--performance-schema=OFF"]
          resources: {{ .Values.database.resources | toJson }}
          env:
            - { name: MARIADB_DATABASE, value: {{ .Values.database.name | quote }} }
            - { name: MARIADB_USER, value: {{ .Values.database.user | quote }} }
            - { name: MARIADB_PASSWORD_FILE, value: /run/secrets/database-password }
            - { name: MARIADB_ROOT_PASSWORD_FILE, value: /run/secrets/database-root-password }
          ports:
            - { name: mysql, containerPort: 3306 }
          startupProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: db-secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - name: db-secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0444
            items:
              - { key: database-password, path: database-password }
              - { key: database-root-password, path: database-root-password }
        {{- if .Values.database.storage.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.database.storage.existingClaim }}
        {{- end }}
  {{- if not .Values.database.storage.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.database.storage.storageClass }}
        storageClassName: {{ ternary "" .Values.database.storage.storageClass (eq .Values.database.storage.storageClass "-") | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
  {{- end }}
{{- end }}
