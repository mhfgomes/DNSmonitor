# Use with: docker compose -f compose.yaml -f deploy/compose.scaled.yaml up -d --scale dns-worker=2 --wait
services:
  worker:
    environment:
      RUNTIME_ROLE: api
  dns-worker:
    image: dnsmonitor:local
    environment:
      DATABASE_HOST: mariadb
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      RUNTIME_ROLE: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_CHECK_HOURS: ${RETENTION_CHECK_HOURS:-24}
      RETENTION_SUMMARY_DAYS: ${RETENTION_SUMMARY_DAYS:-90}
      RETENTION_EVENT_DAYS: ${RETENTION_EVENT_DAYS:-30}
      RETENTION_INCIDENT_DAYS: ${RETENTION_INCIDENT_DAYS:-90}
      RETENTION_DELIVERY_DAYS: ${RETENTION_DELIVERY_DAYS:-30}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-90}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-250}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 45s
    networks: [backend, egress]
    restart: unless-stopped
