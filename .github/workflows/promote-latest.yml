name: Promote existing image to latest
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dockerhub-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Read published image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$RELEASE_TAG" --pattern IMAGE.txt --dir .
          grep -Eq '^mhfgomes/dnsmonitor@sha256:[a-f0-9]{64}$' IMAGE.txt
          test "$(wc -l < IMAGE.txt)" -eq 1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: mhfgomes
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Update latest image tag
        run: docker buildx imagetools create --tag mhfgomes/dnsmonitor:latest "$(cat IMAGE.txt)"
