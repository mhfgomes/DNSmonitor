name: Publish versioned release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dockerhub-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check Docker Hub credential
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Configure the DOCKERHUB_TOKEN secret with write access to mhfgomes/dnsmonitor.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify tag and release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release/check.mjs
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: scripts/check-deployments.sh
      - run: scripts/release/package.sh
      - name: Determine image name
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "name=mhfgomes/dnsmonitor" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: mhfgomes
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          build-args: |
            VCS_REF=${{ steps.image.outputs.revision }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: true
      - name: Publish release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/release/IMAGE.txt
          (cd dist/release && sha256sum IMAGE.txt >> SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --title "DNSmonitor $RELEASE_TAG" --notes-file CHANGELOG.md dist/release/*
      - name: Update latest image tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
