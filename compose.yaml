name: dnsmonitor
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: dnsmonitor
      MARIADB_USER: dnsmonitor
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD in .env}
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=30", "--performance-schema=OFF"]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped
  migrate:
    image: dnsmonitor:local
    build: .
    command: ["node", "dist/apps/cli/src/database.js", "migrate"]
    environment:
      DATABASE_HOST: mariadb
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [backend]
    restart: "no"
  worker:
    image: dnsmonitor:local
    build: .
    environment:
      DATABASE_HOST: mariadb
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: ${METRICS_HOST:-127.0.0.1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_CHECK_HOURS: ${RETENTION_CHECK_HOURS:-24}
      RETENTION_SUMMARY_DAYS: ${RETENTION_SUMMARY_DAYS:-90}
      RETENTION_EVENT_DAYS: ${RETENTION_EVENT_DAYS:-30}
      RETENTION_INCIDENT_DAYS: ${RETENTION_INCIDENT_DAYS:-90}
      RETENTION_DELIVERY_DAYS: ${RETENTION_DELIVERY_DAYS:-30}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-90}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-250}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-60}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      RUNTIME_ROLE: ${RUNTIME_ROLE:-all}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.RUNTIME_ROLE==='worker'?3001:3000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 45s
    networks: [backend, egress]
    restart: unless-stopped
volumes:
  database:
networks:
  backend:
    internal: true
  egress:
